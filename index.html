<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>EiyuruVoice Pro</title>
    <style>
        body { background: #0B0C10; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        h1 { color: #FF2E93; text-shadow: 0 0 10px #FF2E93; }
        .panel { background: #121214; border: 1px solid #FF2E93; padding: 15px; border-radius: 8px; max-width: 500px; margin: 0 auto 20px; }
        input { background: #1F2833; border: 1px solid #FF2E93; color: #fff; padding: 5px; border-radius: 4px; font-size: 12px; margin: 5px; }
        #grid { display: grid; grid-template-columns: repeat(8, 45px); gap: 3px; justify-content: center; margin: 20px auto; }
        .cell { width: 45px; height: 40px; background: #1F2833; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 9px; }
        .cell.active { background: #FF2E93; box-shadow: 0 0 10px #FF2E93; }
        .btn { background: #FF2E93; color: #fff; border: none; padding: 12px 30px; font-weight: bold; cursor: pointer; border-radius: 8px; }
        #log { color: #00FF66; font-family: monospace; margin-top: 15px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>EIYURU VOICE PRO</h1>
    
    <div class="panel">
        <label>🎙️ Voicebank (.wav):</label> <input type="file" accept="audio/wav" onchange="loadVB(event)" /><br>
        <label>🎵 UTAU Track (.ust):</label> <input type="file" accept=".ust" onchange="loadUST(event)" />
    </div>

    <div id="grid"></div>
    <button class="btn" onclick="play()">Synthesize</button>
    <div id="log">[SYSTEM]: Ready. Load Voicebank or UST.</div>

<script>
    const notes = ["C5", "B4", "A4", "G4", "F4", "E4", "D4", "C4"];
    const freqs = [523.25, 493.88, 440.00, 392.00, 349.23, 329.63, 293.66, 261.63];
    const grid = document.getElementById('grid');
    const log = document.getElementById('log');
    let vbBuffer = null, audioCtx = null, matrix = Array(8).fill().map(() => Array(8).fill(null));

    function createGrid() {
        grid.innerHTML = '';
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerHTML = `<span>${notes[r]}</span><b id="l-${r}-${c}"></b>`;
                cell.onclick = () => {
                    if (matrix[r][c]) {
                        matrix[r][c] = null; cell.classList.remove('active'); document.getElementById(`l-${r}-${c}`).innerText = '';
                    } else {
                        const lyr = prompt("Lyric:", "a") || "a";
                        matrix[r][c] = { lyric: lyr, freq: freqs[r] }; cell.classList.add('active'); document.getElementById(`l-${r}-${c}`).innerText = lyr;
                    }
                };
                grid.appendChild(cell);
            }
        }
    }

    function loadVB(e) {
        if (!e.target.files[0]) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const reader = new FileReader();
        reader.onload = (evt) => {
            audioCtx.decodeAudioData(evt.target.result, b => { vbBuffer = b; log.innerText = "[VOICEBANK]: Loaded!"; });
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    }

    function loadUST(e) {
        if (!e.target.files[0]) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            matrix = Array(8).fill().map(() => Array(8).fill(null)); createGrid();
            let col = 0;
            evt.target.result.split(/\[#\d+\]/).forEach(sec => {
                if (!sec.includes("NoteNum") || col >= 8) return;
                const noteNum = parseInt(sec.match(/NoteNum=(\d+)/)?.[1] || 60);
                const lyr = sec.match(/Lyric=([^\r\n]+)/)?.[1] || "a";
                const f = 440 * Math.pow(2, (noteNum - 69) / 12);
                let row = freqs.reduce((best, cur, idx) => Math.abs(cur - f) < Math.abs(freqs[best] - f) ? idx : best, 0);
                matrix[row][col] = { lyric: lyr, freq: f };
                const cView = grid.children[(row * 8) + col];
                if (cView) { cView.classList.add('active'); document.getElementById(`l-${row}-${col}`).innerText = lyr; }
                col++;
            });
            log.innerText = `[UST]: Loaded ${col} notes.`;
        };
        reader.readAsText(e.target.files[0], "ISO-8859-1");
    }

    function play() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let hasNotes = false;
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (!matrix[r][c]) continue;
                hasNotes = true;
                const start = audioCtx.currentTime + (c * 0.35);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(vbBuffer ? 0.5 : 0.2, start + 0.03);
                gain.gain.linearRampToValueAtTime(0, start + 0.35);

                if (vbBuffer) {
                    const src = audioCtx.createBufferSource();
                    src.buffer = vbBuffer;
                    src.playbackRate.value = matrix[r][c].freq / 440.0;
                    src.connect(gain).connect(audioCtx.destination);
                    src.start(start); src.stop(start + 0.35);
                } else {
                    const osc = audioCtx.createOscillator();
                    osc.type = 'triangle'; osc.frequency.value = matrix[r][c].freq;
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start(start); osc.stop(start + 0.35);
                }
            }
        }
        log.innerText = hasNotes ? "✨ Playing..." : "[WARNING]: Grid is empty!";
    }
    createGrid();
</script>
</body>
</html>
