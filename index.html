<!DOCTYPE html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<title>EiyuruVoice Studio</title>
		
		<!-- Mobil cihazlarda tam ekran uygulama (PWA) gibi görünmesi için ayarlar -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

		<style>
			/* Siberpunk Temalı Tasarım Kodları */
			body { 
				background: #0B0C10; 
				color: #ffffff; 
				font-family: system-ui, -apple-system, sans-serif; 
				padding: 20px; 
				text-align: center;
				margin: 0;
			}
			h1 { color: #FF2E93; text-shadow: 0 0 10px #FF2E93; margin-top: 20px; }
			p { color: #888888; font-size: 14px; }
			
			.lang-bar { margin-bottom: 20px; }
			.lang-btn { background: #1F2833; border: 1px solid #FF2E93; color: white; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; margin: 0 3px; }
			.lang-btn.active { background: #FF2E93; }

			#grid { display: grid; grid-template-columns: repeat(8, 40px); gap: 3px; justify-content: center; margin: 25px auto; width: fit-content; }
			.cell { width: 40px; height: 40px; background: #1F2833; border-radius: 4px; cursor: pointer; transition: background 0.1s; }
			.cell.active { background: #FF2E93; box-shadow: 0 0 10px #FF2E93; }
			
			.btn-synth { background: linear-gradient(45deg, #FF2E93, #D41D75); color: #fff; border: none; padding: 12px 24px; font-weight: bold; font-size: 15px; cursor: pointer; border-radius: 8px; box-shadow: 0 4px 15px rgba(255, 46, 147, 0.4); }
			.btn-synth:hover { transform: scale(1.02); }
		</style>
	</head>
	<body>

		<!-- Dil Seçim Çubuğu -->
		<div class="lang-bar">
			<button class="lang-btn active" onclick="setLang('tr', this)">TR</button>
			<button class="lang-btn" onclick="setLang('en', this)">EN</button>
			<button class="lang-btn" onclick="setLang('ja', this)">JA</button>
		</div>

		<h1>EIYURU VOICE</h1>
		<p id="sub-title">Kendi sanal şarkıcını oluştur!</p>

		<!-- Nota Çizim Alanı -->
		<div id="grid"></div>

		<!-- Sesi Başlatma Butonu -->
		<button class="btn-synth" id="btn-synth" onclick="playMusic()">Sesi Sentezle</button>

	<script>
		// Ses ve Dil Motoru Kodları
		const freqs = [523.25, 493.88, 440.00, 392.00, 349.23, 329.63, 293.66, 261.63]; 
		const grid = document.getElementById('grid');
		
		const languages = {
			tr: { sub: "Kendi sanal şarkıcını oluştur!", synth: "Sesi Sentezle" },
			en: { sub: "Create your virtual singer!", synth: "Synthesize Audio" },
			ja: { sub: "仮想シンガーを作ろう！", synth: "音声合成" }
		};

		// 8x8 Izgarayı oluşturma
		for (let r = 0; r < 8; r++) {
			for (let c = 0; c < 8; c++) {
				const cell = document.createElement('div');
				cell.className = 'cell';
				cell.dataset.freq = freqs[r];
				cell.dataset.step = c;
				cell.onclick = () => cell.classList.toggle('active');
				grid.appendChild(cell);
			}
		}

		function setLang(lang, element) {
			document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
			element.classList.add('active');
			document.getElementById('sub-title').innerText = languages[lang].sub;
			document.getElementById('btn-synth').innerText = languages[lang].synth;
		}

		function playMusic() {
			const ctx = new (window.AudioContext || window.webkitAudioContext)();
			document.querySelectorAll('.cell.active').forEach(cell => {
				const osc = ctx.createOscillator();
				const gain = ctx.createGain();
				const time = ctx.currentTime + (cell.dataset.step * 0.3);
				
				osc.frequency.value = parseFloat(cell.dataset.freq);
				osc.type = 'triangle';
				
				gain.gain.setValueAtTime(0, time);
				gain.gain.linearRampToValueAtTime(0.2, time + 0.02);
				gain.gain.linearRampToValueAtTime(0, time + 0.28);
				
				osc.connect(gain).connect(ctx.destination);
				osc.start(time);
				osc.stop(time + 0.3);
			});
		}
	</script>
	</body>
</html>
